# E2 Cartels (Milestone 3, §7). One cartel among sincere donors; premium Π against a
# common-random-numbers counterfactual (same seed, cartel off). W is static, so every
# cell is solved (M2 review decision); one cell is cross-checked by annual simulation.
experiment: E2
description: Cartel premium over α, size, internal share, topology and member selection.
base:
  N: 500
alphas: [0.2, 0.35, 0.5, 0.65, 0.8, 0.9]
ks: [2, 3, 5, 10, 20]
phis: [0.25, 0.5, 0.75, 1.0]
topologies: [clique, ring, star]
selections: [random, same_field, low_q, high_q]
seeds: 50
