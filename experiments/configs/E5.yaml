# E5 Feedback and equity, plus the mechanism comparison (Milestone 4, §7).
#
# Part A (feedback): every mechanism runs in the same yearly loop with the same production,
# visibility feedback (λ) and turnover. ω is the evaluators' weight on reputation: it is
# applied to SOFA donors (omega) and to panels (omega_p) alike. Panels and lotteries are run
# with the spec's b_share = 0 (unfunded researchers get nothing) and with b_share = 0.5,
# which matches SOFA's unconditional floor (1 − α)·B at α = 0.5.
# Part B (comparison, H6): λ = 0; SOFA over ω × σ_p; panels and lotteries over ω.
# Static cells (SOFA with λ = 0 and no turnover; equal split; oracle without turnover) are
# solved; all others are simulated for T years (M2 review decision).
experiment: E5
description: Reputation feedback, turnover and equity across allocation mechanisms; mechanism comparison.
base:
  N: 500
mechanisms:        # (name, b_share)
  - [sofa, 0.0]
  - [panel, 0.0]
  - [panel, 0.5]
  - [lottery, 0.0]
  - [lottery, 0.5]
  - [equal, 0.0]
  - [oracle, 0.0]
lams: [0.0, 0.2, 0.4]
omegas: [0.0, 0.3, 0.6]
turnover: [false, true]
theta_sensitivity:          # extra cells at λ = 0.2, ω = 0.3, no turnover
  thetas: [0.3, 0.8]
comparison:
  omegas: [0.0, 0.3, 0.6]
  sigma_ps: [0.25, 0.5, 1.0]
trajectory_metrics: [gini, early_ratio, senior_ratio, field_4_ratio, stability, efficiency,
                     efficiency_net, visibility_gini, spearman_Kq, top10_share]
seeds: 50
